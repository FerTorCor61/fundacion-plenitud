<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contacto - Fundación Plenitud</title>
<link rel="stylesheet" href="styles.css">

<!-- EmailJS -->
<script src="https://cdn.jsdelivr.net/npm/emailjs-com@3/dist/email.min.js"></script>
<script>
  (function() {
    emailjs.init("_7pfbZOs-FVV4Y3mI"); 
  })();
</script>

<style>
  /* Estilos adicionales */
  .form-group { margin-bottom: 15px; }
  .form-group label { display: block; margin-bottom: 5px; font-weight: bold; }
  .form-group input, .form-group select, .form-group textarea {
    width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 4px; box-sizing: border-box;
  }
  .modalidad-direccion {
    background-color: #f9f9f9; padding: 10px; border-radius: 4px; margin-top: 10px; border-left: 3px solid #3467ff;
  }
  .qr-image { width: 250px; border: 1px solid #ccc; margin-bottom: 10px; }
  .checkbox-group { display: flex; gap: 10px; margin-top: 10px; align-items: center; }
  .submit-btn {
    margin-top: 15px; background: #3467ff; color: white; padding: 12px 24px;
    border: none; border-radius: 6px; cursor: pointer; font-size: 16px;
  }
  .submit-btn:hover { background: #234dcc; }
</style>

</head>

<body>

<header class="site-header">
  <div class="container">
    <div class="logo">
      <img src="images/logo.png" alt="Fundación Plenitud logo">
    </div>

    <nav class="main-nav">
      <a href="index.html">Inicio</a>
      <a href="quienes.html">¿Quiénes Somos?</a>
      <a href="historias.html">Historias</a>
      <a href="patrocinio.html">Patrocinio</a>
      <a href="servicios.html">Servicios</a>
      <a href="contacto.html" style="font-weight:bold;">Contacto</a>
    </nav>
  </div>
</header>

<main class="container">

<section class="page">
  <h1>Reserva tu Cita</h1>

  <h2>Horario de atención</h2>
  <p class="horario-texto">Lun-Vie 09:00-12:00 | 14:00-18:00</p>

  <h3 style="margin-top:30px;">Formulario de Reserva</h3>

  <form id="reservaForm">

    <div class="form-group">
      <label for="nombre">Nombre completo:</label>
      <input type="text" id="nombre" required>
    </div>

    <div class="form-group">
      <label for="sexo">Sexo:</label>
      <select id="sexo" required>
        <option value="">Seleccione…</option>
        <option value="Hombre">Hombre</option>
        <option value="Mujer">Mujer</option>
        <option value="Otros">Otros</option>
      </select>
    </div>

    <div class="form-group">
      <label for="edad">Edad:</label>
      <input type="number" id="edad" min="1" max="120" required>
    </div>

    <div class="form-group">
      <label for="ciudad">Ciudad:</label>
      <input type="text" id="ciudad" required>
    </div>

    <div class="form-group">
      <label for="telefono">WhatsApp del paciente:</label>
      <input type="tel" id="telefono" required>
    </div>

    <div class="form-group">
      <label for="tipoPaciente">Tipo de paciente:</label>
      <select id="tipoPaciente" required>
        <option value="">Seleccione…</option>
        <option value="general">Público general</option>
        <option value="estudiante">Estudiante Fundación</option>
      </select>
    </div>

    <div id="campoEstudiante" style="display:none;">
      <div class="form-group">
        <label for="nombreEstudiante">Nombre del Estudiante Fundación:</label>
        <input type="text" id="nombreEstudiante">
      </div>
    </div>

    <div class="form-group">
      <label for="motivoConsulta">Motivo de consulta:</label>
      <textarea id="motivoConsulta" rows="3" required></textarea>
    </div>

    <div class="form-group">
      <label for="profesional">Profesional:</label>
      <select id="profesional" required>
        <option value="">Seleccione…</option>
        <option value="Lic. Christian">Lic. Christian Claure T.</option>
        <option value="Mgr. Sandra">Mgr. Sandra Aranda B.</option>
        <option value="Lic. Fernando">Lic. Fernando de la Torre C.</option>
      </select>
    </div>

    <div class="form-group">
      <label for="modalidad">Modalidad de consulta:</label>
      <select id="modalidad" required>
        <option value="">Seleccione…</option>
        <option value="Presencial">Presencial</option>
        <option value="Virtual">Virtual</option>
      </select>
    </div>

    <div id="infoModalidad" style="display:none;">
      <div class="modalidad-direccion">
        <p id="textoModalidad"></p>
      </div>
    </div>

    <div class="form-group">
      <label for="fecha">Fecha:</label>
      <input type="date" id="fecha" required>
    </div>

    <div class="form-group">
      <label for="hora">Hora:</label>
      <select id="hora" required>
        <option value="">Seleccione…</option>
        <optgroup label="Mañana">
          <option value="09:00">09:00</option>
          <option value="10:00">10:00</option>
          <option value="11:00">11:00</option>
        </optgroup>
        <optgroup label="Tarde">
          <option value="14:00">14:00</option>
          <option value="15:00">15:00</option>
          <option value="16:00">16:00</option>
          <option value="17:00">17:00</option>
          <option value="18:00">18:00</option>
        </optgroup>
      </select>
    </div>

    <h4>Costo de la sesión</h4>
    <p id="costoTexto"><b>Primera sesión: 250 Bs</b></p>

    <h3 style="margin-top:30px;">Pagar para Confirmar Reserva</h3>
    <p>Escanee el QR y luego marque la confirmación.</p>

    <img src="images/QR.png" class="qr-image">

    <div class="checkbox-group">
      <input type="checkbox" id="confirmarPago" required>
      <label for="confirmarPago">Confirmo que realicé el pago mediante QR.</label>
    </div>

    <div class="form-group">
      <label for="comprobante">Subir comprobante (imagen):</label>
      <input type="file" id="comprobante" accept="image/*" required>
    </div>

    <button type="submit" class="submit-btn">Enviar Reserva</button>
  </form>

  <p id="respuesta" style="margin-top:20px;color:green;font-weight:bold;"></p>

</section>

</main>

<footer class="site-footer">
  <!-- PIE DE PÁGINA ORIGINAL AQUÍ -->
</footer>

<script>
// URL correcta de tu WebApp
const GOOGLE_WEBAPP_URL =
"https://script.google.com/macros/s/AKfycbxWarny1isBIGx-HnFArOsbZ-rFuId45TDLFLKGKYdwv8QqNXg_uFUyRHc92soNjWVHHQ/exec";

// Base64
function fileToBase64(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result);
    reader.onerror = err => reject(err);
    reader.readAsDataURL(file);
  });
}

// Mostrar costo y campos
document.getElementById("tipoPaciente").addEventListener("change", function () {
  const campoEstudiante = document.getElementById("campoEstudiante");
  const costoTexto = document.getElementById("costoTexto");

  if (this.value === "estudiante") {
    campoEstudiante.style.display = "block";
    costoTexto.innerHTML = "<b>Estudiante Fundación: 90 Bs / sesión</b>";
  } else {
    campoEstudiante.style.display = "none";
    costoTexto.innerHTML = "<b>Primera sesión: 250 Bs | Siguientes: 150 Bs</b>";
  }
});

// Modalidad
document.getElementById("modalidad").addEventListener("change", function () {
  const info = document.getElementById("infoModalidad");
  const texto = document.getElementById("textoModalidad");

  if (this.value === "Presencial") {
    info.style.display = "block";
    texto.innerHTML = "<strong>Dirección</strong>: Calle Quilla #100 entre Intiraymi y Av. Beijing";
  } else if (this.value === "Virtual") {
    info.style.display = "block";
    texto.innerHTML = "<strong>Videollamada</strong>: Enlace enviado por WhatsApp antes de la sesión.";
  } else {
    info.style.display = "none";
  }
});

// Envío completo
document.getElementById("reservaForm").addEventListener("submit", async e => {
  e.preventDefault();

  if (!document.getElementById("confirmarPago").checked) {
    alert("Debe confirmar que realizó el pago.");
    return;
  }

  const archivo = document.getElementById("comprobante").files[0];
  if (!archivo) {
    alert("Debe subir el comprobante.");
    return;
  }

  try {
    const comprobanteB64 = await fileToBase64(archivo);

    // 🔥 DATOS COMPLETOS CON ACTION
    const data = {
      action: "reserva",
      nombre: nombre.value,
      sexo: sexo.value,
      edad: edad.value,
      ciudad: ciudad.value,
      telefono: telefono.value,
      tipoPaciente: tipoPaciente.value,
      nombreEstudiante: nombreEstudiante.value || "",
      motivoConsulta: motivoConsulta.value,
      profesional: profesional.value,
      modalidad: modalidad.value,
      fecha: fecha.value,
      hora: hora.value,
      comprobante: comprobanteB64
    };

    // Enviar a Google WebApp
    const resp = await fetch(GOOGLE_WEBAPP_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(data)
    });

    // WhatsApp automático
    const telefonos = {
      "Lic. Christian": "59167413716",
      "Mgr. Sandra": "59167439286",
      "Lic. Fernando": "59162690019"
    };

    const mensaje =
`🔔 Nueva Reserva
👤 ${data.nombre}
⚧️ ${data.sexo}
🎂 ${data.edad} años
🏙️ ${data.ciudad}
📅 ${data.fecha}
⏰ ${data.hora}
💻 ${data.modalidad}
📝 ${data.motivoConsulta}`;

    fetch(`https://api.callmebot.com/whatsapp.php?phone=${telefonos[data.profesional]}&text=${encodeURIComponent(mensaje)}&apikey=348275`);

    // EmailJS
    const correos = {
      "Lic. Christian": "guentokhrjss@gmail.com",
      "Mgr. Sandra": "babayaga352@gmail.com",
      "Lic. Fernando": "delatorre.cortes.fernando@gmail.com"
    };

    emailjs.send("service_bj6yafl", "template_k35sy5s", {
      ...data,
      correo_destino: correos[data.profesional],
      copia: "fundacion.plenitud.bo@gmail.com"
    });

    respuesta.innerHTML = "Reserva enviada correctamente. Le confirmaremos por WhatsApp.";

    reservaForm.reset();
    infoModalidad.style.display = "none";
    campoEstudiante.style.display = "none";

  } catch (e) {
    console.error(e);
    respuesta.innerHTML = "Error al enviar la reserva. Intente nuevamente.";
    respuesta.style.color = "red";
  }
});
</script>

</body>
</html>
