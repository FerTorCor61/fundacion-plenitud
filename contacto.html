<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reserva tu Cita - Fundación Plenitud</title>

<style>
body { font-family: Arial, sans-serif; margin: 0; padding: 0; background: #f7f7f7; }
.container { max-width: 900px; margin: auto; padding: 20px; background: white; border-radius: 10px; }
h1, h2, h3 { color: #234dcc; }
.form-group { margin-bottom: 15px; }
label { font-weight: bold; display: block; margin-bottom: 5px; }
input, select, textarea {
  width: 100%; padding: 8px; border: 1px solid #ccc;
  border-radius: 5px; box-sizing: border-box;
}
.submit-btn {
  background: #3467ff; color: white; padding: 12px;
  border: none; border-radius: 6px; cursor: pointer;
  font-size: 16px; width: 100%;
}
.submit-btn:hover { background: #234dcc; }
.qr-image { width: 250px; margin-top: 10px; border-radius: 10px; }
.checkbox-group { display: flex; align-items: center; gap: 8px; }
.modalidad-info {
  background: #eef3ff; padding: 10px; border-left: 4px solid #3467ff;
  border-radius: 5px; margin-top: 10px;
}
</style>
</head>

<body>

<div class="container">
<h1>Reserva tu Cita</h1>
<h2>Horario de Atención</h2>
<p>Lunes a Viernes • 09:00–12:00 y 14:00–18:00</p>

<form id="reservaForm">

  <!-- Nombre -->
  <div class="form-group">
    <label>Nombre completo:</label>
    <input type="text" id="nombre" required>
  </div>

  <!-- Sexo -->
  <div class="form-group">
    <label>Sexo:</label>
    <select id="sexo" required>
      <option value="">Seleccione…</option>
      <option>Hombre</option>
      <option>Mujer</option>
      <option>Otros</option>
    </select>
  </div>

  <!-- Edad -->
  <div class="form-group">
    <label>Edad:</label>
    <input type="number" id="edad" min="1" max="120" required>
  </div>

  <!-- País -->
  <div class="form-group">
    <label>País desde donde me hablas:</label>
    <select id="paisSelect" required>
      <option value="">Seleccione…</option>
      <option value="Bolivia">Bolivia</option>
      <option value="Otro">Otro país</option>
    </select>
  </div>

  <!-- Bolivia -->
  <div id="boliviaFields" style="display:none;">

    <div class="form-group">
      <label>Departamento:</label>
      <select id="departamento">
        <option value="">Seleccione…</option>
        <option value="Cochabamba">Cochabamba</option>
        <option value="La Paz">La Paz</option>
        <option value="Santa Cruz">Santa Cruz</option>
        <option value="Oruro">Oruro</option>
        <option value="Potosí">Potosí</option>
        <option value="Chuquisaca">Chuquisaca</option>
        <option value="Tarija">Tarija</option>
        <option value="Beni">Beni</option>
        <option value="Pando">Pando</option>
      </select>
    </div>

    <!-- Ciudad solo si es Cochabamba -->
    <div class="form-group" id="ciudadField" style="display:none;">
      <label>Ciudad:</label>
      <input type="text" id="ciudad" placeholder="Ej: Cochabamba">
    </div>

  </div>

  <!-- Otro País -->
  <div id="otroPaisField" style="display:none;">
    <div class="form-group">
      <label>País (escriba):</label>
      <input type="text" id="paisLibre">
    </div>
  </div>

  <!-- WhatsApp -->
  <div class="form-group">
    <label>WhatsApp del paciente:</label>
    <input type="text" id="telefono" required>
  </div>

  <!-- Tipo de paciente -->
  <div class="form-group">
    <label>Tipo de paciente:</label>
    <select id="tipoPaciente" required>
      <option value="">Seleccione…</option>
      <option value="normal">Paciente normal</option>
      <option value="estudiante">Estudiante Fundación</option>
    </select>
  </div>

  <div class="form-group" id="campoEstudiante" style="display:none;">
    <label>Nombre del Estudiante Fundación:</label>
    <input type="text" id="nombreEstudiante">
  </div>

  <!-- Motivo -->
  <div class="form-group">
    <label>Motivo de consulta:</label>
    <textarea id="motivoConsulta" rows="3" required></textarea>
  </div>

  <!-- Profesional -->
  <div class="form-group">
    <label>Profesional:</label>
    <select id="profesional" required>
      <option value="">Seleccione…</option>
      <option value="Lic. Christian">Lic. Christian Claure T.</option>
      <option value="Mgr. Sandra">Mgr. Sandra Aranda B.</option>
      <option value="Lic. Fernando">Lic. Fernando de la Torre C.</option>
    </select>
  </div>

  <!-- Modalidad -->
  <div class="form-group">
    <label>Modalidad de consulta:</label>
    <select id="modalidad" required>
      <option value="">Seleccione…</option>
      <option value="Presencial">Presencial</option>
      <option value="Virtual">Virtual</option>
    </select>
  </div>

  <div id="infoModalidad" class="modalidad-info" style="display:none;">
    <p id="textoModalidad"></p>
  </div>

  <!-- Fecha -->
  <div class="form-group">
    <label>Fecha:</label>
    <input type="date" id="fecha" required>
  </div>

  <!-- Hora -->
  <div class="form-group">
    <label>Hora:</label>
    <select id="hora" required>
      <option value="">Seleccione…</option>
      <option>09:00</option><option>10:00</option><option>11:00</option>
      <option>14:00</option><option>15:00</option><option>16:00</option>
      <option>17:00</option><option>18:00</option>
    </select>
  </div>

  <!-- COSTO -->
  <h3>Costo de la sesión</h3>
  <p id="costoTexto"><b>Primera sesión: 250 Bs</b></p>

  <!-- QR -->
  <h3>Pagar para Confirmar Reserva</h3>
  <p>Escanee el QR y luego marque la confirmación.</p>
  <img src="images/QR.png" class="qr-image">

  <div class="checkbox-group">
    <input type="checkbox" id="confirmarPago" required>
    <label>Confirmo que realicé el pago mediante QR.</label>
  </div>

  <!-- Comprobante -->
  <div class="form-group">
    <label>Subir comprobante (imagen):</label>
    <input type="file" id="comprobante" accept="image/*" required>
  </div>

  <button type="submit" class="submit-btn">Enviar Reserva</button>

  <p id="respuesta" style="margin-top:20px; font-weight:bold;"></p>

</form>
</div>

<script>
// ----------------------------
// CAMPOS
// ----------------------------
const paisSelect = document.getElementById("paisSelect");
const boliviaFields = document.getElementById("boliviaFields");
const otroPaisField = document.getElementById("otroPaisField");
const departamento = document.getElementById("departamento");
const ciudadField = document.getElementById("ciudadField");
const ciudad = document.getElementById("ciudad");
const modalidad = document.getElementById("modalidad");
const infoModalidad = document.getElementById("infoModalidad");
const textoModalidad = document.getElementById("textoModalidad");
const tipoPaciente = document.getElementById("tipoPaciente");
const campoEstudiante = document.getElementById("campoEstudiante");
const costoTexto = document.getElementById("costoTexto");


// ----------------------------
// LÓGICA PAÍS
// ----------------------------
paisSelect.addEventListener("change", () => {
  if (paisSelect.value === "Bolivia") {
    boliviaFields.style.display = "block";
    otroPaisField.style.display = "none";
    ciudadField.style.display = "none";
    modalidad.disabled = false;
  } else {
    boliviaFields.style.display = "none";
    otroPaisField.style.display = "block";

    ciudadField.style.display = "none";

    modalidad.value = "Virtual";
    modalidad.querySelector("option[value='Presencial']").disabled = true;

    infoModalidad.style.display = "block";
    textoModalidad.textContent = "Solo modalidad virtual para pacientes fuera de Bolivia.";
  }
});


// ----------------------------
// LÓGICA DEPARTAMENTO
// ----------------------------
departamento.addEventListener("change", () => {
  if (departamento.value === "Cochabamba") {
    ciudadField.style.display = "block";

    modalidad.querySelector("option[value='Presencial']").disabled = false;
    infoModalidad.style.display = "none";

  } else {
    ciudadField.style.display = "none";
    ciudad.value = "";

    modalidad.value = "Virtual";
    modalidad.querySelector("option[value='Presencial']").disabled = true;

    infoModalidad.style.display = "block";
    textoModalidad.textContent =
      "Las consultas presenciales solo están disponibles en Cochabamba. En otros departamentos solo se habilita modalidad virtual.";
  }
});


// ----------------------------
// TIPO DE PACIENTE
// ----------------------------
tipoPaciente.addEventListener("change", () => {
  if (tipoPaciente.value === "estudiante") {
    campoEstudiante.style.display = "block";
    costoTexto.innerHTML = "<b>Estudiante Fundación: 90 Bs / sesión</b>";
  } else {
    campoEstudiante.style.display = "none";
    costoTexto.innerHTML = "<b>Primera sesión: 250 Bs | Siguientes: 150 Bs</b>";
  }
});

</script>

</body>
</html>
